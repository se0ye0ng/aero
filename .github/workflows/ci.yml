name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,torch,detect]"
          python -m pip install -r requirements/yolox-runtime.txt
          python -m pip install --no-deps --require-hashes -r requirements/yolox.txt
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: python -m pytest
