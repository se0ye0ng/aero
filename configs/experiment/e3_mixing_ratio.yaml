# @package _global_
# E3 - ratio crossed with budget mode. Separates "generated data harms" from
# "replacing real data with generated data harms".
defaults:
  - override /data: flir_urban
  - override /generator: diffv2ir
  - override /sensor: eo_ir_default
  - override /curation: none
  - override /detector: yolox_s
  - override /train: pretrained

name: e3_mixing_ratio
sweep:
  generator: [synthetic_baseline, diffv2ir]
  mixing.budget_mode: [fixed_total, additive]
  # 1.0 is undefined for additive mixing because the real count is held constant.
  mixing.gen_ratio: [0.0, 0.1, 0.2, 0.4, 0.6, 0.8]
  seed: [0, 1, 2]
sweep_control:
  collapse_at_zero_generated: [generator, mixing.budget_mode]
