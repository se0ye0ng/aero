# @package _global_
# E5 - sequence-disjoint small-target external validation.
defaults:
  - override /data: antiuav_small
  - override /generator: pid_tev
  - override /sensor: matched
  - override /curation: rfs_topk
  - override /detector: yolox_s
  - override /train: pretrained

name: e5_small_target
data:
  coverage_split: sequence_disjoint
mixing:
  budget_mode: additive
sweep:
  mixing.gen_ratio: [0.0, 0.2, 0.4, 0.8]
  sensor: [none, eo_ir_default, matched]
  seed: [0, 1, 2]
sweep_control:
  collapse_at_zero_generated: [sensor]
analysis:
  stratify_by: [target_pixel_area, contrast_quartile, polarity, clutter_level]
  external_evaluation_only: true
  prohibit_generator_access_to_eval_frames: true
