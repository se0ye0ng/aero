name: antiuav_small
paired_source_root: ${paths.data_root}/Anti-UAV300
external_eval_root: ${paths.data_root}/Anti-UAV410
external_eval_manifest: ${oc.env:AERO_ANTIUAV410_MANIFEST,experiments/antiuav410_test_manifest.json}
modality: visible_thermal_source__thermal_external
label_format: antiuav_tracking
classes: [uav]

splits:
  generator_development: Anti-UAV300/train
  detector_train: Anti-UAV300/train
  validation: Anti-UAV300/val
  external_test: Anti-UAV410/test

# The operational regime: small, low-contrast targets against sky and terrain clutter.
coverage_split: sequence_disjoint
sequence_policy:
  group_key: video_id
  prohibit_frame_overlap: true
  prohibit_generator_access_to_validation_or_test: true
  tracking_to_detection_adapter_required: true

labels:
  audit:
    enabled: true
    min_iou: 0.6                  # looser: tiny boxes are IoU-sensitive by construction
    max_centroid_shift_frac: 0.25
    max_area_ratio_change: 0.50
    min_target_contrast: 2.0
