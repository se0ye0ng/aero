name: llvip
root: ${paths.data_root}/llvip
modality: thermal
label_format: coco
classes: [person]
splits: {train: train, val: val, test: test}
coverage_split: same_scene
labels:
  audit: {enabled: true, min_iou: 0.7, max_centroid_shift_frac: 0.15,
          max_area_ratio_change: 0.35, min_target_contrast: 3.0}
